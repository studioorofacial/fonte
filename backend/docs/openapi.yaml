components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token JWT enviado no header ''Authorization: Bearer <token>'''
    cookieAuth:
      type: apiKey
      in: cookie
      name: refreshToken
      description: Cookie httpOnly assinado, definido automaticamente no login (válido por 7 dias)
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    Carousel:
      type: object
      properties:
        id_carousel:
          type: integer
        title:
          type: string
        description:
          type: string
        background_image:
          type: string
          nullable: true
        id_user:
          type: integer
    CarouselInput:
      type: object
      required:
      - title
      - description
      - id_user
      properties:
        title:
          type: string
        description:
          type: string
        background_image:
          type: string
          nullable: true
        id_user:
          type: integer
    Differential:
      type: object
      properties:
        id_differential:
          type: integer
        description:
          type: string
        id_user:
          type: integer
    DifferentialInput:
      type: object
      required:
      - description
      - id_user
      properties:
        description:
          type: string
        id_user:
          type: integer
    History:
      type: object
      properties:
        id_history:
          type: integer
        title:
          type: string
        text:
          type: string
        image:
          type: string
          nullable: true
        id_user:
          type: integer
    HistoryInput:
      type: object
      required:
