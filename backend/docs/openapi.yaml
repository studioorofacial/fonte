openapi: 3.0.3
info:
  title: Backend API
  version: 1.0.0
  description: Documentação da API REST do backend (Express + MySQL). Gerencia conteúdo de um site institucional
    (carousel, equipe, história, diferenciais, itens, localização, informações de contato) e um painel
    administrativo com autenticação por access/refresh token.
servers:
- url: http://localhost:8080/api
  description: Servidor local de desenvolvimento
tags:
- name: Auth
  description: Login, refresh e logout
- name: Users
  description: Gestão de usuários do painel administrativo
- name: Roles
  description: Cargos de acesso (Root, Admin, Secretaria)
- name: Panel
  description: Painel administrativo
- name: Carousel
  description: Banners do carrossel da home
- name: Differentials
  description: Diferenciais exibidos no site
- name: History
  description: Seção de história/sobre
- name: HomeInfo
  description: Informações de destaque da home
- name: Info
  description: Informações de contato (telefone/whatsapp)
- name: Item
  description: Catálogo de itens/serviços
- name: Location
  description: Endereço e localização
- name: Main
  description: Banners principais por página
- name: Message
  description: Mensagens do formulário de contato
- name: Principles
  description: Princípios/valores da empresa
- name: Team
  description: Membros da equipe
paths:
  /admin-panel:
    get:
      tags:
      - Panel
      summary: Retorna o HTML do painel administrativo
      description: Requer autenticação. Serve o arquivo estático admin-panel.html, que não é acessível
        por nenhum outro meio.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: HTML do painel
          content:
            text/html:
              schema:
                type: string
        '401': &id001
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500': *id001
  /auth/login:
    post:
      tags:
      - Auth
      summary: Login
      description: Autentica com email OU login (usuário) + senha. Retorna access token e define cookie
        httpOnly de refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  user:
                    type: object
                    properties:
                      id_user:
                        type: integer
                      name:
                        type: string
                      email:
                        type: string
                      role_id:
                        type: integer
        '400': *id001
        '401': *id001
        '500': *id001
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Logout
      description: Invalida o refresh token atual e limpa o cookie.
      responses:
        '200':
          description: Logout realizado com sucesso
        '500': *id001
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: Renova o access token
      description: Usa o cookie httpOnly assinado 'refreshToken' (enviado automaticamente pelo navegador)
        para gerar um novo access token.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Novo token gerado
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        '401': *id001
        '403': *id001
  /carousel:
    get:
      tags:
      - Carousel
      summary: Lista todos os registros de Carousel
      security: &id002 []
      responses:
        '200':
          description: Lista de registros
