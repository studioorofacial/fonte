<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Orofacial — Painel Admin</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="icon" href="img/novo/clinica.ico" type="image/x-icon">
<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<!-- CSS -->
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<!-- =================================================================
     LOGIN SCREEN
================================================================= -->
<div id="login-screen">

  <!-- HEADER igual ao site -->
  <div class="header">
    <div>
        <a href="index.html" class="logo">
            <img src="img/novo/logo1_fd.png" alt="Logo marca Orofacial.">
            <img src="img/home/studio_ajustado.png" alt="Imagem do logo com nome Studio Orofacial.">
        </a>
    </div>
    <nav class="menu">
        <a href="index.html">Home</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="contato.html">Contato</a>
        <a href="sobre.html">Sobre</a>
    </nav>
  </div>

  <!-- BANNER -->
  <div class="page-title">
    <h1>Acesso Restrito</h1>
    <p>Apenas pessoal autorizado</p>
  </div>

  <!-- FORM LOGIN -->
  <div class="login-wrap">
    <div class="login-box">
      <h2><i class="bi bi-shield-lock"></i> Autenticação</h2>

      <div class="login-error" id="login-error">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>Usuário ou senha incorretos.
      </div>

      <div class="mb-3">
        <label class="form-label">Login:</label>
        <div class="input-group">
          <span class="input-group-text" style="border:2px solid #e0e0e0;background:#f9f9f9;border-right:none">
            <i class="bi bi-person-fill" style="color:var(--roxo)"></i>
          </span>
          <input type="text" class="form-control" id="login-user"
            placeholder="Usuário ou e-mail"
            style="border-left:none"
            autocomplete="username">
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label">Senha:</label>
        <div class="input-group">
          <span class="input-group-text" style="border:2px solid #e0e0e0;background:#f9f9f9;border-right:none">
            <i class="bi bi-lock-fill" style="color:var(--roxo)"></i>
          </span>
          <input type="password" class="form-control" id="login-pass"
            placeholder="••••••••"
            style="border-left:none;border-right:none"
            autocomplete="current-password"
            onkeydown="if(event.key==='Enter')doLogin()">
          <button class="btn btn-outline-secondary" type="button" onclick="togglePw('login-pass',this)">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <div class="d-flex gap-3">
        <button class="btn btn-roxo flex-fill py-2" onclick="doLogin()">
          <i class="bi bi-box-arrow-in-right me-2"></i>Logar
        </button>
        <button class="btn btn-dourado px-4 py-2"
          onclick="document.getElementById('login-user').value='';document.getElementById('login-pass').value=''">
          Limpa
        </button>
      </div>
    </div>
  </div>

  <div class="footer">Desenvolvido por Grupo 5</div>
</div>

<!-- =================================================================
     PANEL SCREEN
================================================================= -->
<div id="panel-screen">
  <!-- Preenchido dinamicamente via JS após o login, buscando
       do backend com o token de autenticação -->
</div><!-- /panel-screen -->

<!-- =================================================================
     MODAL — CONFIRMAR DELETE
================================================================= -->
<div class="modal fade" id="modal-delete" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-exclamation-triangle-fill me-2"></i>Confirmar exclusão</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted" id="modal-delete-msg">Tem certeza que deseja excluir este registro? Esta ação não pode ser desfeita.</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-danger" data-bs-dismiss="modal" onclick="resolverConfirmacaoExclusao(true)"><i class="bi bi-trash me-1"></i>Sim, excluir</button>
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL — EDITAR -->
<div class="modal fade" id="modal-edit" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content border-0 shadow">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-edit-title"><i class="bi bi-pencil-fill me-2"></i>Editar Registro</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="modal-edit-body"></div>
      <div class="modal-footer">
        <button class="btn btn-roxo" onclick="saveEdit()"><i class="bi bi-floppy-fill me-1"></i>Salvar Edição</button>
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
      </div>
    </div>
  </div>
</div>

<!-- TOAST CONTAINER -->
<div class="toast-container">
  <div id="main-toast" class="toast align-items-center text-white border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body fw-bold" id="toast-msg">Operação realizada!</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Toda a lógica JS da página (CRUD via API + autenticação/sessão) -->
<script src="js/admin.js"></script>

</body>
</html>
